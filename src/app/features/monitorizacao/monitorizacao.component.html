<div class="monitorizacao-shell">
  <app-status-bar></app-status-bar>

  <app-monitoring-top-bar
    [patientName]="patientName"
    [patientAge]="patientAge"
    [patientRecord]="patientRecord"
    [procedureName]="procedureName"
    [anesthesiaTimer]="anesthesiaTimer"
    [surgeryTimer]="surgeryTimer"
    [primaryAction]="primaryAction"
    [isAnesthesiaStarted]="isAnesthesiaStarted"
    [isSurgeryStarted]="isSurgeryStarted"
    [isSurgeryFinished]="isSurgeryFinished"
    [isAnesthesiaFinished]="isAnesthesiaFinished"
    [canEdit]="canEdit"
    [canFinalize]="canFinalize"
    [pendingSyncCount]="pendingSyncCount"
    [isSyncing]="isSyncing"
    (back)="goToFichaAnestesica()"
    (patientClick)="openFichaAnestesicaModal()"
    (primaryClick)="onTopPrimaryAction()"
    (finalizeClick)="onFinalize()"
    (syncNow)="syncPendingNow()"
  ></app-monitoring-top-bar>

  <div class="readonly-banner" *ngIf="!isResponsible">
    {{ 'monitorizacao.page.readonlyBanner' | translate }}
  </div>

  <div class="monitorizacao-shell__loading" *ngIf="isLoading">
    <span class="monitorizacao-shell__spinner" aria-hidden="true"></span>
    <span>{{ 'monitorizacao.shell.loading' | translate }}</span>
  </div>

  <main class="monitorizacao-shell__body" *ngIf="!isLoading">
    <app-monitoring-timeline
      class="monitorizacao-shell__timeline"
      [vitalRecords]="vitalRecords"
      [customFields]="customFields"
      [agents]="agents"
      [infusionPumps]="infusionPumps"
      [oxygenFlows]="oxygenFlows"
      [compressedAirFlows]="compressedAirFlows"
      [fluidBalance]="fluidBalance"
      [positionHistory]="positionHistory"
      [clinicalEvents]="clinicalEvents"
      [anesthesiaStartTime]="startTimeAnesthesia"
      [anesthesiaEndTime]="anesthesiaEndTime"
      [surgeryStartTime]="startTimeSurgery"
      [surgeryEndTime]="surgeryEndTime"
      [readonly]="!canEdit"
      [lastSavedAt]="lastDraftSavedAt"
      [reservedRight]="reservedRight"
      [groups]="visibleGroups"
      (cellTap)="onTimelineCellTap($event)"
      (agentTap)="onAgentTap($event)"
      (pumpTap)="onStopInfusion($event)"
      (eventTap)="onEventTap($event)"
      (balanceTap)="openHistory('balance')"
      (hydrationAdd)="onHydrationAdd()"
      (hydrationTap)="onHydrationTap($event)"
      (resourceToggle)="onResourceToggle($event)"
      (positionTap)="mudarPosicao()"
      (customize)="openCustomize()"
    ></app-monitoring-timeline>

    <app-monitoring-tool-bar
      class="monitorizacao-shell__tools"
      [readonly]="!canEdit"
      [active]="activeTool"
      [activePumps]="activePumpsCount"
      (toolClick)="onToolClick($event)"
    ></app-monitoring-tool-bar>
  </main>
</div>
