<div class="app-container">
  <app-status-bar></app-status-bar>
  <app-header-institucional
    [showBackButton]="true"
    [showPreAnestesicaButton]="true"
    (openPreAnestesica)="openAnestesicaRecord()"
  >
  </app-header-institucional>

  <div class="main-grid">
    <div class="channels-column" [style.gridTemplateRows]="channelsGridRows">
      <app-vital-signs-chart
        [vitalRecords]="vitalRecords"
        [anesthesiaStartTime]="anesthesiaStartTime"
        [surgeryStartTime]="surgeryStartTime"
        [surgeryEndTime]="surgeryEndTime"
        [positionHistory]="positionHistory"
        [clinicalEvents]="clinicalEvents"
        [agents]="agents"
        [hoverTime]="hoverTime"
        [readonly]="isSurgeryFinished"
        (hoverTimeChange)="hoverTime = $event"
        (addVitalRecord)="openVitalModal()"
        (openHistory)="openDrawer('vitals')"
        (addCustomField)="openCustomFieldModal()"
      >
      </app-vital-signs-chart>

      <app-agents-chart
        class="channel channel-strip"
        [class.is-collapsed]="expandedPanel !== 'agents'"
        [class.is-expanded]="expandedPanel === 'agents'"
        [collapsed]="expandedPanel !== 'agents'"
        [agents]="agents"
        [anesthesiaStartTime]="anesthesiaStartTime"
        [surgeryEndTime]="surgeryEndTime"
        [hoverTime]="sharedHoverTime"
        (hoverTimeChange)="onSharedHover($event)"
        (toggle)="togglePanel('agents')"
        [readonly]="isSurgeryFinished"
        (addAgent)="openAgentModal()"
        (openHistory)="openHistoryDrawer('agents')"
      >
      </app-agents-chart>

      <app-events-chart
        class="channel channel-strip"
        [class.is-collapsed]="expandedPanel !== 'events'"
        [class.is-expanded]="expandedPanel === 'events'"
        [collapsed]="expandedPanel !== 'events'"
        [events]="clinicalEvents"
        [positionHistory]="positionHistory"
        [anesthesiaStartTime]="anesthesiaStartTime"
        [surgeryEndTime]="surgeryEndTime"
        [hoverTime]="sharedHoverTime"
        (hoverTimeChange)="onSharedHover($event)"
        (toggle)="togglePanel('events')"
        [readonly]="isSurgeryFinished"
        (addEvent)="openEventModal()"
        (openHistory)="openHistoryDrawer('events')"
      >
      </app-events-chart>

      <app-fluid-balance-chart
        class="channel channel-strip"
        [class.is-collapsed]="expandedPanel !== 'balance'"
        [class.is-expanded]="expandedPanel === 'balance'"
        [collapsed]="expandedPanel !== 'balance'"
        [balance]="fluidBalance"
        [anesthesiaStartTime]="anesthesiaStartTime"
        [surgeryEndTime]="surgeryEndTime"
        [hoverTime]="sharedHoverTime"
        (hoverTimeChange)="onSharedHover($event)"
        (toggle)="togglePanel('balance')"
        [readonly]="isSurgeryFinished"
        (addBalance)="openBalanceModal()"
        (openHistory)="openHistoryDrawer('balance')"
      >
      </app-fluid-balance-chart>
    </div>

    <app-quick-action-sidebar
      class="sidebar-right"
      [isAnesthesiaStarted]="isAnesthesiaStarted"
      [isSurgeryStarted]="isSurgeryStarted"
      [isSurgeryFinished]="isSurgeryFinished"
      [startTimeAnesthesia]="startTimeAnesthesia"
      [startTimeSurgery]="startTimeSurgery"
      [anesthesiaTimer]="anesthesiaTimer"
      [surgeryTimer]="surgeryTimer"
      [posicaoAtual]="posicaoAtual"
      [posicoesPossiveis]="posicoesPossiveis"
      [positionHistory]="positionHistory"
      [recentActivity]="recentActivity"
      [autoMonitoringIntervalMinutes]="autoMonitoringIntervalMinutes"
      (iniciarAnestesia)="iniciarAnestesia()"
      (iniciarCirurgia)="iniciarCirurgia()"
      (mudarPosicao)="mudarPosicao($event)"
      (reconfigurarFrequencia)="reconfigurarFrequencia()"
      (addVital)="addTimePoint()"
      (addAgent)="openAgentModal()"
      (addEvent)="openEventModal()"
      (addBalance)="openBalanceModal()"
      (openHistoryFull)="openHistoryDrawer('vitals')"
    >
    </app-quick-action-sidebar>
  </div>

  <app-finalize-anesthesia-bar
    [draftSavedAt]="lastDraftSavedAt"
    [pendingSyncCount]="pendingSyncCount"
    [isAnesthesiaStarted]="isAnesthesiaStarted"
    [isSurgeryFinished]="isSurgeryFinished"
    [isSyncing]="isSyncing"
    (syncNow)="syncPendingNow()"
    (openHistory)="openHistoryDrawer('vitals')"
    (finalize)="encerrarAnestesia()"
  >
  </app-finalize-anesthesia-bar>

  <app-history-drawer
    *ngIf="historyDrawerOpen"
    [initialTab]="historyDrawerTab"
    [vitalRecords]="vitalRecords"
    [customFields]="customFields"
    [agents]="agents"
    [events]="clinicalEvents"
    [balance]="fluidBalance"
    [isSurgeryFinished]="isSurgeryFinished"
    (close)="historyDrawerOpen = false"
    (editRecord)="onEditVital($event)"
    (deleteRecord)="onDeleteVital($event)"
    (editAgent)="onEditAgent($event)"
    (deleteAgent)="onDeleteAgent($event)"
    (editEvent)="onEditEvent($event)"
    (deleteEvent)="onDeleteEvent($event)"
    (editBalance)="onEditBalance($event)"
    (deleteBalance)="onDeleteBalance($event)"
    (addCustomField)="addCustomField()"
    (addTimePoint)="addTimePoint()"
  >
  </app-history-drawer>
</div>
