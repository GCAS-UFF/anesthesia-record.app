<footer class="finalize-bar" [class.disabled]="!isAnesthesiaStarted || isAnesthesiaFinished">

  <div class="status-cluster">
    <div class="status-item">
      <ion-icon name="save-outline"></ion-icon>
      <span>{{ savedLabel }}</span>
    </div>

    <div class="divider"></div>

    <div class="status-item" [class.warn]="pendingSyncCount > 0">
      <ion-icon [name]="pendingSyncCount > 0 ? 'cloud-offline-outline' : 'cloud-done-outline'"></ion-icon>
      <span *ngIf="pendingSyncCount === 0">{{ 'monitorizacao.finalizeBar.allSynced' | translate }}</span>
      <span *ngIf="pendingSyncCount > 0">{{ pendingSyncCount }} {{ (pendingSyncCount > 1 ? 'monitorizacao.finalizeBar.pendingPlural' : 'monitorizacao.finalizeBar.pendingSingular') | translate }}</span>
    </div>

    <button class="btn-sync"
            *ngIf="pendingSyncCount > 0"
            [disabled]="isSyncing"
            (click)="syncNow.emit()">
      <ion-icon [name]="isSyncing ? 'refresh-outline' : 'cloud-upload-outline'"
                [class.spin]="isSyncing"></ion-icon>
      {{ (isSyncing ? 'monitorizacao.finalizeBar.syncing' : 'monitorizacao.finalizeBar.syncNow') | translate }}
    </button>

    <button class="btn-history" (click)="openHistory.emit()">
      <ion-icon name="list-outline"></ion-icon>
      {{ 'monitorizacao.finalizeBar.history' | translate }}
    </button>
  </div>

  <button class="btn-finalize"
          [disabled]="!isAnesthesiaStarted || isAnesthesiaFinished"
          (click)="finalize.emit()">
    <ion-icon name="power-outline"></ion-icon>
    <span>{{ (isSurgeryFinished ? 'monitorizacao.finalizeBar.finalizeAnesthesia' : 'monitorizacao.finalizeBar.finalizeSurgery') | translate }}</span>
  </button>

</footer>
