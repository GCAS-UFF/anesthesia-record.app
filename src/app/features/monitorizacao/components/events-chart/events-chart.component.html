<div class="channel-inner" [class.is-collapsed]="collapsed">
  <header class="channel-header" (click)="onHeaderClick($event)">
    <div class="ch-title">
      <span class="dot"></span>
      <ion-icon name="warning-outline"></ion-icon>
      <span class="ch-name">{{ 'monitorizacao.events.title' | translate }}</span>
      <span class="count" *ngIf="totalCount">{{ totalCount }}</span>
    </div>

    <div class="ch-actions" (click)="$event.stopPropagation()">
      <ion-button
        size="small"
        fill="clear"
        (click)="toggle($event)"
        [attr.aria-label]="(collapsed ? 'monitorizacao.events.expandAria' : 'monitorizacao.events.collapseAria') | translate"
      >
        <ion-icon [name]="collapsed ? 'chevron-down-outline' : 'chevron-up-outline'" slot="icon-only"></ion-icon>
      </ion-button>
    </div>
  </header>

  <div class="events-list" *ngIf="!collapsed">
    <div
      class="event-row"
      *ngFor="let row of sortedItems"
      (mouseenter)="onMarkerEnter(row.item)"
      (mouseleave)="onMarkerLeave()"
      [title]="itemHM(row.item) + ' · ' + desc(row.item)"
    >
      <span class="ev-icon" [style.color]="row.lane.color">{{ row.lane.icon }}</span>
      <span class="ev-time">{{ itemHM(row.item) }}</span>
      <span class="ev-desc">{{ desc(row.item) }}</span>
    </div>

    <div class="events-empty" *ngIf="!sortedItems.length">{{ 'monitorizacao.events.empty' | translate }}</div>
  </div>
</div>
