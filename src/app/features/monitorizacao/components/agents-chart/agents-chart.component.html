<div class="channel-inner">
  <header class="channel-header" (click)="onHeaderClick($event)">
    <div class="ch-title">
      <span class="dot"></span>
      <ion-icon name="medkit-outline"></ion-icon>
      <span>AGENTES</span>
      <span class="count" *ngIf="agents.length">({{ agents.length }})</span>
    </div>

    <div class="ch-actions" (click)="$event.stopPropagation()">
      <ion-button size="small" fill="clear" (click)="openHistory.emit()" title="Ver todos">
        <ion-icon name="list-outline" slot="icon-only"></ion-icon>
      </ion-button>
      <ion-button size="small" fill="solid" (click)="addAgent.emit()" [disabled]="readonly">
        <ion-icon name="add-outline" slot="start"></ion-icon>
        Agente
      </ion-button>
      <ion-button size="small" fill="clear" (click)="toggle.emit()"
                  [title]="collapsed ? 'Expandir' : 'Recolher'">
        <ion-icon [name]="collapsed ? 'chevron-down-outline' : 'chevron-up-outline'" slot="icon-only"></ion-icon>
      </ion-button>
    </div>
  </header>

  <ng-container *ngIf="!collapsed">
    <div class="lanes-area" *ngIf="lanes.length; else emptyTpl">
      <div class="lane" *ngFor="let lane of lanes">
        <div class="lane-label" [style.color]="colorFor(lane.name)">💊 {{ lane.name }}</div>
        <div class="lane-track">
          <ng-container *ngFor="let item of lane.items">
            <span
              class="marker"
              [style.left.%]="posX(item)"
              [style.background]="colorFor(lane.name)"
              [title]="itemHM(item) + ' · ' + lane.name + ' ' + (item.dose||'') + ' ' + (item.route||'')">
            </span>
            <span class="marker-time" [style.left.%]="posX(item)">{{ itemHM(item) }}</span>
          </ng-container>
        </div>
        <div class="lane-value" *ngIf="lane.items.length">
          {{ lane.items[lane.items.length - 1].dose || '' }}
        </div>
      </div>
    </div>

    <ng-template #emptyTpl>
      <div class="empty">Nenhum agente lançado</div>
    </ng-template>
  </ng-container>
</div>
