<div class="app-container">
  <app-status-bar></app-status-bar>

  <app-header-institucional></app-header-institucional>

  <main class="page-main">
    <section class="page-header">
      <div>
        <h1 class="page-title">Todos os Pacientes</h1>
        <p class="page-subtitle">
          Pacientes aguardando responsável — Assuma, crie ou visualize as fichas
          anestésicas.
        </p>
      </div>
    </section>
    <section class="toolbar">
      <div class="search-wrap">
        <ion-icon
          name="search-outline"
          class="search-icon"
          aria-hidden="true"
        ></ion-icon>
        <input
          type="text"
          class="search-input"
          placeholder="Buscar por paciente ou prontuário"
          [value]="searchQuery"
          (input)="onSearchChange($any($event.target).value)"
        />
      </div>

      <div class="segmented" role="tablist" aria-label="Filtro de status">
        <button
          role="tab"
          [attr.aria-selected]="selectedStatus === null"
          [class.active]="selectedStatus === null"
          (click)="changeStatus(null)"
        >
          Todos
        </button>
        <button
          role="tab"
          [attr.aria-selected]="selectedStatus === SurgeryStatusEnum.Agendado"
          [class.active]="selectedStatus === SurgeryStatusEnum.Agendado"
          (click)="changeStatus(SurgeryStatusEnum.Agendado)"
        >
          Agendados
        </button>
        <button
          role="tab"
          [attr.aria-selected]="selectedStatus === SurgeryStatusEnum.Concluido"
          [class.active]="selectedStatus === SurgeryStatusEnum.Concluido"
          (click)="changeStatus(SurgeryStatusEnum.Concluido)"
        >
          Realizados
        </button>
        <button
          role="tab"
          [attr.aria-selected]="selectedStatus === SurgeryStatusEnum.Cancelada"
          [class.active]="selectedStatus === SurgeryStatusEnum.Cancelada"
          (click)="changeStatus(SurgeryStatusEnum.Cancelada)"
        >
          Cancelados
        </button>
      </div>
    </section>

    <section class="meta-bar">
      <div class="meta-left">
        <app-date-filter
          [date]="selectedDate"
          (dateChange)="onDateChange($event)"
        ></app-date-filter>

        <button
          class="refresh-btn"
          (click)="handleRefresh()"
          [disabled]="isRefreshing"
          aria-label="Atualizar lista"
          title="Atualizar lista"
        >
          <ion-spinner *ngIf="isRefreshing" name="crescent"></ion-spinner>
          <ion-icon *ngIf="!isRefreshing" name="refresh-outline"></ion-icon>
        </button>
      </div>

      <span class="count-pill"> {{ totalItems }} procedimentos hoje </span>
    </section>

    <section class="procedures-list">
      <ng-container *ngIf="!isLoading">
        <app-procedure-card
          *ngFor="let p of viewList"
          [patientName]="p.patientName"
          [room]="p.room"
          [isOpen]="openCardId === p.id"
          (openChange)="onOpenChange($event)"
          [surgicalCenter]="p.surgicalCenter"
          [canAbandon]="p.anesthesiologist !== null && p.anesthesiologist.id === currentUserId"
          [bed]="p.bed"
          [floor]="p.floor"
          [unit]="p.unit"
          [surgeryDate]="p.surgeryDate"
          [procedure]="p.procedure"
          [status]="p.status"
          [time]="p.time"
          [completedAt]="p.completedAt"
          [birthDate]="p.birthDate"
          [age]="p.age"
          [record]="p.record"
          [id]="p.id"
          [anesthesiologist]="p.anesthesiologist?.fullName || ''"
          [isCurrentAnesthesiologist]="isUserAssignedToThisPatient(p)"
          [isPreAnesthesiaRecordDone]="p.isPreAnesthesiaRecordDone"
          [canAssumePatient]="canAssumePatient"
          [isAdmin]="isAdminUser"
          (assume)="onAssume(p.id, p.patientId, $event)"
          (openFicha)="onOpenFicha(p.id, p.patientId)"
          (viewRegistro)="onViewRegistro(p.id)"
          (abandonSurgery)="abandonPatient(p.id, p.patientId)"
          (openPreAnesthesia)="onOpenPreAnesthesia(p.id, p.patientId)"
        ></app-procedure-card>

        <app-empty-state
          *ngIf="totalItems === 0"
          icon="📭"
          message="Nenhum procedimento encontrado para os filtros selecionados."
        ></app-empty-state>
      </ng-container>

      <ng-container *ngIf="isLoading">
        <div class="skeleton-card" *ngFor="let item of [1,2,3]">
          <div class="skeleton-side">
            <ion-skeleton-text
              animated
              style="width: 70px; height: 14px"
            ></ion-skeleton-text>
            <ion-skeleton-text
              animated
              style="width: 60px; height: 28px; margin-top: 8px"
            ></ion-skeleton-text>
            <ion-skeleton-text
              animated
              style="
                width: 120px;
                height: 22px;
                margin-top: 12px;
                border-radius: 999px;
              "
            ></ion-skeleton-text>
          </div>
          <div class="skeleton-body">
            <ion-skeleton-text
              animated
              style="width: 180px; height: 14px"
            ></ion-skeleton-text>
            <ion-skeleton-text
              animated
              style="width: 60%; height: 24px; margin-top: 10px"
            ></ion-skeleton-text>
            <ion-skeleton-text
              animated
              style="width: 40%; height: 14px; margin-top: 8px"
            ></ion-skeleton-text>
            <ion-skeleton-text
              animated
              style="width: 50%; height: 16px; margin-top: 16px"
            ></ion-skeleton-text>
          </div>
          <div class="skeleton-actions">
            <ion-skeleton-text
              animated
              style="width: 160px; height: 44px; border-radius: 12px"
            ></ion-skeleton-text>
            <ion-skeleton-text
              animated
              style="width: 160px; height: 44px; border-radius: 12px"
            ></ion-skeleton-text>
          </div>
        </div>
      </ng-container>
    </section>

    <div class="pagination-container" *ngIf="totalItems > pageSize">
      <button
        (click)="prevPage()"
        [disabled]="currentPage === 1"
        class="page-btn"
      >
        <ion-icon name="chevron-back-outline"></ion-icon> Anterior
      </button>
      <span class="page-info">
        Página <strong>{{ currentPage }}</strong> de {{ totalPages }}
      </span>
      <button
        (click)="nextPage()"
        [disabled]="currentPage === totalPages"
        class="page-btn"
      >
        Próximo <ion-icon name="chevron-forward-outline"></ion-icon>
      </button>
    </div>
  </main>
</div>
