<div class="fullscreen-container">
  <div class="main-content">
    <div class="login-card">
      <div class="login-header">
        <div class="login-logo-wrapper">
          <img
            src="assets/Logo.png"
            alt="Logo do Sistema"
            class="login-logo-img"
          />
        </div>
        <h1 class="login-system-name">Sistema de Gerenciamento Anestésico</h1>
      </div>

      <app-error-message [message]="error || ''"></app-error-message>

      <div class="status-group">
        <div
          class="status-item"
          [class.connected]="serverConnected"
          [class.disconnected]="!serverConnected"
          title="Conexão com a rede"
        >
          <ion-icon name="wifi-outline"></ion-icon>
          <span>Rede</span>
        </div>

        <div
          class="status-item"
          [class.connected]="aghuConnected"
          [class.disconnected]="!aghuConnected"
          title="Integração AGHU"
        >
          <ion-icon name="cloud-outline"></ion-icon>
          <span>AGHU</span>
        </div>
      </div>

      <form [formGroup]="form" (ngSubmit)="submit()" autocomplete="off">
        <app-custom-input
          label="Usuário"
          type="text"
          placeholder="Digite seu usuário"
          [required]="true"
          autocomplete="nope"
          (focused)="clearError()"
          formControlName="username"
        >
        </app-custom-input>

        <app-custom-input
          label="Senha"
          type="password"
          placeholder="Digite sua senha"
          [required]="true"
          autocomplete="new-password"
          (focused)="clearError()"
          formControlName="password"
        >
        </app-custom-input>

        <div class="form-options">
          <a href="#" class="forgot-link" (click)="esqueceuSenha($event)"
            >Esqueceu a senha?</a
          >
        </div>

        <app-loading-button
          [loading]="loading"
          [disabled]="form.invalid"
          type="submit"
        >
          <span>ENTRAR</span>
        </app-loading-button>

        <div class="login-notice">
          <ion-icon name="information-circle-outline"></ion-icon>
          <span
            >Utilize o mesmo usuário e senha do sistema AGHU para acessar.</span
          >
        </div>
      </form>
    </div>
  </div>

  <div class="footer">
    <div class="footer-text">
      Sistema de Gerenciamento Anestésico - v1 <br />
      UFF - Universidade Federal Fluminense
    </div>
  </div>
</div>
