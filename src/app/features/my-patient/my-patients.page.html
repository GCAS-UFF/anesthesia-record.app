<div class="app-container">
  <app-status-bar></app-status-bar>

  <app-header-institucional></app-header-institucional>

  <main class="page-main">
    <div class="filters-wrapper" #filtersContainer>
    <section class="filters-bar">
      <div class="page-title-block">
        <h1 class="page-title">{{ 'myPatients.title' | translate }}</h1>
      </div>

      <button
        type="button"
        class="filters-toggle"
        (click)="toggleFilters()"
        [attr.aria-expanded]="filtersOpen"
        aria-controls="my-patients-filters-panel"
      >
        <ion-icon name="options-outline" class="filters-toggle-icon"></ion-icon>
        <span class="filters-toggle-label">{{ 'myPatients.filters.toggle' | translate }}</span>

        <span class="filters-chips" *ngIf="!filtersOpen">
          <span class="chip" [class.chip-active]="selectedStatus !== 'all'">{{ statusLabel }}</span>
          <span class="chip" [class.chip-active]="!isTodaySelected">{{ dateLabel }}</span>
          <span class="chip chip-search" *ngIf="searchQuery">"{{ searchQuery }}"</span>
        </span>

        <ion-icon
          name="chevron-down-outline"
          class="filters-chevron"
          [class.open]="filtersOpen"
        ></ion-icon>
      </button>

      <div class="filters-meta">
        <button
          class="refresh-btn"
          (click)="handleRefresh()"
          [disabled]="isRefreshing"
          [attr.aria-label]="'myPatients.refresh.label' | translate"
          [title]="'myPatients.refresh.label' | translate"
        >
          <ion-spinner *ngIf="isRefreshing" name="crescent"></ion-spinner>
          <ion-icon *ngIf="!isRefreshing" name="refresh-outline"></ion-icon>
        </button>

        <span class="count-pill"> {{ totalItems }} {{ 'myPatients.countSuffix' | translate }} </span>
      </div>
    </section>

    <section
      id="my-patients-filters-panel"
      class="filters-panel"
      [class.open]="filtersOpen"
    >
      <div class="toolbar">
        <div class="search-wrap">
          <ion-icon
            name="search-outline"
            class="search-icon"
            aria-hidden="true"
          ></ion-icon>
          <input
            type="text"
            class="search-input"
            [placeholder]="'myPatients.filters.searchPlaceholder' | translate"
            [value]="searchQuery"
            (input)="onSearchChange($any($event.target).value)"
          />
        </div>

        <div class="segmented" role="tablist" [attr.aria-label]="'myPatients.filters.statusAriaLabel' | translate">
          <button
            role="tab"
            [attr.aria-selected]="selectedStatus === 'all'"
            [class.active]="selectedStatus === 'all'"
            (click)="changeStatus('all')"
          >
            {{ 'myPatients.status.all' | translate }}
          </button>
          <button
            role="tab"
            [attr.aria-selected]="selectedStatus === 'inProgress'"
            [class.active]="selectedStatus === 'inProgress'"
            (click)="changeStatus('inProgress')"
          >
            {{ 'myPatients.status.inProgress' | translate }}
          </button>
          <button
            role="tab"
            [attr.aria-selected]="selectedStatus === 'completed'"
            [class.active]="selectedStatus === 'completed'"
            (click)="changeStatus('completed')"
          >
            {{ 'myPatients.status.completed' | translate }}
          </button>
        </div>
      </div>

      <div class="date-row">
        <app-date-filter
          [date]="selectedDate"
          (dateChange)="onDateChange($event)"
        ></app-date-filter>
      </div>
    </section>
    </div>

    <section
      class="procedures-list"
      (scroll)="onListScroll()"
      (touchstart)="onListTouchStart($event)"
      (touchmove)="onListTouchMove($event)"
      (touchend)="onListTouchEnd()"
      (touchcancel)="onListTouchEnd()"
    >
      <div
        class="pull-refresher"
        [class.active]="isRefreshing || pullDistance >= pullThreshold"
        [style.height.px]="isRefreshing ? pullThreshold : pullDistance"
      >
        <ion-spinner *ngIf="isRefreshing" name="crescent"></ion-spinner>
        <ion-icon
          *ngIf="!isRefreshing"
          name="arrow-down-outline"
          [style.transform]="pullDistance >= pullThreshold ? 'rotate(180deg)' : 'rotate(0deg)'"
        ></ion-icon>
      </div>

      <ng-container *ngIf="!isRefreshing">
        <app-procedure-card
          *ngFor="let p of viewList"
          [patientName]="p.patientName"
          [room]="p.room"
          [isOpen]="openCardId === p.id"
          (openChange)="onOpenChange($event)"
          [surgicalCenter]="p.surgicalCenter"
          [canAbandon]="true"
          [bed]="p.bed"
          [floor]="p.floor"
          [surgeryDate]="p.surgeryDate"
          [unit]="p.unit"
          [procedure]="p.procedure"
          [status]="p.status"
          [time]="p.time"
          [completedAt]="p.completedAt"
          [birthDate]="p.birthDate"
          [age]="p.age"
          [record]="p.record"
          [id]="p.id"
          [anesthesiologist]="p.anesthesiologist?.fullName || youLabel"
          [isCurrentAnesthesiologist]="true"
          [canAssumePatient]="false"
          (assume)="onOpenMonitorizacao(p.id, p.patientId)"
          (openFicha)="onOpenFicha(p.id, p.patientId)"
          (viewRegistro)="onViewRegistro(p.id, p.patientId)"
          (abandonSurgery)="abandonPatient(p.id, p.patientId)"
          [isPreAnesthesiaRecordDone]="p.isPreAnesthesiaRecordDone"
          (openPreAnesthesia)="onOpenPreAnesthesia(p.id, p.patientId)"
        ></app-procedure-card>

        <app-empty-state
          *ngIf="totalItems === 0"
          icon="📭"
          [message]="'myPatients.emptyState' | translate"
        ></app-empty-state>
      </ng-container>

      <ng-container *ngIf="isRefreshing">
        <div class="skeleton-card" *ngFor="let item of [1,2,3]">
          <div class="skeleton-side">
            <ion-skeleton-text
              animated
              style="width: 70px; height: 14px"
            ></ion-skeleton-text>
            <ion-skeleton-text
              animated
              style="width: 60px; height: 28px; margin-top: 8px"
            ></ion-skeleton-text>
            <ion-skeleton-text
              animated
              style="
                width: 120px;
                height: 22px;
                margin-top: 12px;
                border-radius: 999px;
              "
            ></ion-skeleton-text>
          </div>
          <div class="skeleton-body">
            <ion-skeleton-text
              animated
              style="width: 180px; height: 14px"
            ></ion-skeleton-text>
            <ion-skeleton-text
              animated
              style="width: 60%; height: 24px; margin-top: 10px"
            ></ion-skeleton-text>
            <ion-skeleton-text
              animated
              style="width: 40%; height: 14px; margin-top: 8px"
            ></ion-skeleton-text>
            <ion-skeleton-text
              animated
              style="width: 50%; height: 16px; margin-top: 16px"
            ></ion-skeleton-text>
          </div>
          <div class="skeleton-actions">
            <ion-skeleton-text
              animated
              style="width: 200px; height: 48px; border-radius: 12px"
            ></ion-skeleton-text>
            <ion-skeleton-text
              animated
              style="width: 160px; height: 48px; border-radius: 12px"
            ></ion-skeleton-text>
          </div>
        </div>
      </ng-container>
    </section>

    <div class="pagination-container" *ngIf="totalItems > pageSize">
      <button
        (click)="prevPage()"
        [disabled]="currentPage === 1"
        class="page-btn"
      >
        <ion-icon name="chevron-back-outline"></ion-icon> {{ 'myPatients.pagination.previous' | translate }}
      </button>
      <span class="page-info">
        {{ 'myPatients.pagination.pageLabel' | translate }} <strong>{{ currentPage }}</strong> {{ 'myPatients.pagination.of' | translate }} {{ totalPages }}
      </span>
      <button
        (click)="nextPage()"
        [disabled]="currentPage === totalPages"
        class="page-btn"
      >
        {{ 'myPatients.pagination.next' | translate }} <ion-icon name="chevron-forward-outline"></ion-icon>
      </button>
    </div>
  </main>
</div>
