<div class="app-container">
  <app-status-bar></app-status-bar>

  <app-header-institucional></app-header-institucional>

  <main class="page-main">
    <section class="page-header">
      <div>
        <h1 class="page-title">Meus Pacientes</h1>
        <p class="page-subtitle">
          Pacientes sob sua responsabilidade — retome a monitorização ou
          consulte a ficha anestésica.
        </p>
      </div>
    </section>

    <section class="toolbar">
      <div class="search-wrap">
        <ion-icon
          name="search-outline"
          class="search-icon"
          aria-hidden="true"
        ></ion-icon>
        <input
          type="text"
          class="search-input"
          placeholder="Buscar por paciente ou prontuário"
          [value]="searchQuery"
          (input)="onSearchChange($any($event.target).value)"
        />
      </div>

      <div class="segmented" role="tablist" aria-label="Filtro de status">
        <button
          role="tab"
          [attr.aria-selected]="selectedStatus === 'all'"
          [class.active]="selectedStatus === 'all'"
          (click)="changeStatus('all')"
        >
          Todos
        </button>
        <button
          role="tab"
          [attr.aria-selected]="selectedStatus === 'inProgress'"
          [class.active]="selectedStatus === 'inProgress'"
          (click)="changeStatus('inProgress')"
        >
          Em Atendimento
        </button>
        <button
          role="tab"
          [attr.aria-selected]="selectedStatus === 'completed'"
          [class.active]="selectedStatus === 'completed'"
          (click)="changeStatus('completed')"
        >
          Realizados
        </button>
      </div>
    </section>

    <section class="meta-bar">
      <div class="meta-left">
        <app-date-filter
          [date]="selectedDate"
          (dateChange)="onDateChange($event)"
        ></app-date-filter>

        <button
          class="refresh-btn"
          (click)="handleRefresh()"
          [disabled]="isRefreshing"
          aria-label="Atualizar lista"
          title="Atualizar lista"
        >
          <ion-spinner *ngIf="isRefreshing" name="crescent"></ion-spinner>
          <ion-icon *ngIf="!isRefreshing" name="refresh-outline"></ion-icon>
        </button>
      </div>

      <span class="count-pill"> {{ totalItems }} paciente(s) seu(s) </span>
    </section>

    <section class="procedures-list">
      <ng-container *ngIf="!isRefreshing">
        <app-procedure-card
          *ngFor="let p of viewList"
          [patientName]="p.patientName"
          [room]="p.room"
          [isOpen]="openCardId === p.id"
          (openChange)="onOpenChange($event)"
          [surgicalCenter]="p.surgicalCenter"
          [canAbandon]="true"
          [bed]="p.bed"
          [floor]="p.floor"
          [surgeryDate]="p.surgeryDate"
          [unit]="p.unit"
          [procedure]="p.procedure"
          [status]="p.status"
          [time]="p.time"
          [completedAt]="p.completedAt"
          [birthDate]="p.birthDate"
          [age]="p.age"
          [record]="p.record"
          [id]="p.id"
          [anesthesiologist]="p.anesthesiologist?.fullName || 'Você'"
          [isCurrentAnesthesiologist]="true"
          [canAssumePatient]="false"
          (assume)="onOpenMonitorizacao(p.id)"
          (openFicha)="onOpenFicha(p.id, p.patientId)"
          (viewRegistro)="onViewRegistro(p.id, p.patientId)"
          (abandonSurgery)="abandonPatient(p.id, p.patientId)"
          [isPreAnesthesiaRecordDone]="p.isPreAnesthesiaRecordDone"
          (openPreAnesthesia)="onOpenPreAnesthesia(p.id, p.patientId)"
        ></app-procedure-card>

        <app-empty-state
          *ngIf="totalItems === 0"
          icon="📭"
          message="Você ainda não tem pacientes para os filtros selecionados."
        ></app-empty-state>
      </ng-container>

      <ng-container *ngIf="isRefreshing">
        <div class="skeleton-card" *ngFor="let item of [1,2,3]">
          <div class="skeleton-side">
            <ion-skeleton-text
              animated
              style="width: 70px; height: 14px"
            ></ion-skeleton-text>
            <ion-skeleton-text
              animated
              style="width: 60px; height: 28px; margin-top: 8px"
            ></ion-skeleton-text>
            <ion-skeleton-text
              animated
              style="
                width: 120px;
                height: 22px;
                margin-top: 12px;
                border-radius: 999px;
              "
            ></ion-skeleton-text>
          </div>
          <div class="skeleton-body">
            <ion-skeleton-text
              animated
              style="width: 180px; height: 14px"
            ></ion-skeleton-text>
            <ion-skeleton-text
              animated
              style="width: 60%; height: 24px; margin-top: 10px"
            ></ion-skeleton-text>
            <ion-skeleton-text
              animated
              style="width: 40%; height: 14px; margin-top: 8px"
            ></ion-skeleton-text>
            <ion-skeleton-text
              animated
              style="width: 50%; height: 16px; margin-top: 16px"
            ></ion-skeleton-text>
          </div>
          <div class="skeleton-actions">
            <ion-skeleton-text
              animated
              style="width: 200px; height: 48px; border-radius: 12px"
            ></ion-skeleton-text>
            <ion-skeleton-text
              animated
              style="width: 160px; height: 48px; border-radius: 12px"
            ></ion-skeleton-text>
          </div>
        </div>
      </ng-container>
    </section>

    <div class="pagination-container" *ngIf="totalItems > pageSize">
      <button
        (click)="prevPage()"
        [disabled]="currentPage === 1"
        class="page-btn"
      >
        <ion-icon name="chevron-back-outline"></ion-icon> Anterior
      </button>
      <span class="page-info">
        Página <strong>{{ currentPage }}</strong> de {{ totalPages }}
      </span>
      <button
        (click)="nextPage()"
        [disabled]="currentPage === totalPages"
        class="page-btn"
      >
        Próximo <ion-icon name="chevron-forward-outline"></ion-icon>
      </button>
    </div>
  </main>
</div>
