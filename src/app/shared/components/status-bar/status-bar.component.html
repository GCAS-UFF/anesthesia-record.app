<div class="status-bar">
  <button class="menu-btn" (click)="openMenu()" [attr.aria-label]="'header.openMenu' | translate">
    <ion-icon name="menu-outline"></ion-icon>
  </button>

  <div class="status-group">
    <div
      class="status-item"
      [class.synced]="syncStatus === SyncStatus.Synced"
      [class.pending]="syncStatus === SyncStatus.Pending"
      [class.syncing]="syncStatus === SyncStatus.Syncing"
      [title]="'statusBar.syncTitle' | translate"
    >
      <span class="badge" *ngIf="pendingDrafts > 0">
        +{{ pendingDrafts }}
      </span>
      <ion-icon
        [name]="
          syncStatus === SyncStatus.Syncing
            ? 'sync-outline'
            : 'cloud-upload-outline'
        "
      >
      </ion-icon>
      <span>{{ 'statusBar.records' | translate }}</span>
    </div>

    <div
      class="status-item"
      [class.connected]="serverConnected"
      [class.disconnected]="!serverConnected"
      [title]="'statusBar.networkTitle' | translate"
    >
      <ion-icon name="wifi-outline"></ion-icon>
      <span>{{ 'statusBar.network' | translate }}</span>
    </div>

    <div
      class="status-item"
      [class.connected]="aghuConnected"
      [class.disconnected]="!aghuConnected"
      [title]="'statusBar.aghuTitle' | translate"
    >
      <ion-icon name="cloud-outline"></ion-icon>
      <span>{{ 'statusBar.aghu' | translate }}</span>
    </div>

    <div class="doctor-chip-wrapper">
      <div
        class="doctor-chip"
        (click)="toggleUserMenu()"
        [class.menu-open]="userMenuOpen"
      >
        <div class="avatar">{{ doctorInitials }}</div>
        <div class="doctor-info">
          <span class="doctor-name">{{ doctorName }}</span>
          <span class="doctor-role">{{ doctorRole }}</span>
        </div>
        <ion-icon name="chevron-down-outline" class="chevron"></ion-icon>
      </div>

      <div
        class="user-menu"
        *ngIf="userMenuOpen"
        (click)="closeUserMenu($event)"
      >
        <button class="user-menu-item" (click)="goToSettings()">
          <ion-icon name="settings-outline"></ion-icon>
          <span>Configurações</span>
        </button>
        <button class="user-menu-item logout" (click)="handleLogout()">
          <ion-icon name="log-out-outline"></ion-icon>
          <span>Sair</span>
        </button>
      </div>
    </div>
  </div>
</div>

<div
  class="drawer-backdrop"
  [class.open]="menuOpen"
  (click)="closeMenu()"
></div>
<aside
  class="drawer"
  [class.open]="menuOpen"
  role="dialog"
  [attr.aria-label]="'header.mainMenu' | translate"
>
  <div class="drawer-header">
    <button class="close-btn" (click)="closeMenu()" [attr.aria-label]="'header.closeMenu' | translate">
      <ion-icon name="close-outline"></ion-icon>
    </button>
    <div class="drawer-logos">
      <img src="assets/Logo.png" alt="Logo" class="logo uff" />
      <span class="drawer-title">{{ hospitalName }}</span>
    </div>
  </div>

  <nav class="drawer-nav">
    <button
      *ngFor="let item of visibleNavItems"
      class="nav-item"
      [class.active]="isActive(item)"
      (click)="navigate(item)"
    >
      <ion-icon [name]="item.icon"></ion-icon>
      <span>{{ item.labelKey | translate }}</span>
    </button>
  </nav>
</aside>
