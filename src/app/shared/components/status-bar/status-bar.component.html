<div class="status-bar">
  <div class="status-left">
    <span class="time">{{ timeStr }}</span>
    <span class="date">{{ dateStr }}</span>
  </div>

  <div class="status-group">
    <div
      class="status-item"
      [class.synced]="syncStatus === SyncStatus.Synced"
      [class.pending]="syncStatus === SyncStatus.Pending"
      [class.syncing]="syncStatus === SyncStatus.Syncing"
      title="Sincronização das fichas"
    >
      <span class="badge" *ngIf="pendingDrafts > 0">
        +{{ pendingDrafts }}
      </span>
      <ion-icon
        [name]="
          syncStatus === SyncStatus.Syncing
            ? 'sync-outline'
            : 'cloud-upload-outline'
        "
      >
      </ion-icon>
      <span>FICHAS</span>
    </div>

    <div
      class="status-item"
      [class.connected]="serverConnected"
      [class.disconnected]="!serverConnected"
      title="Conexão com a rede"
    >
      <ion-icon name="wifi-outline"></ion-icon>
      <span>REDE</span>
    </div>

    <div
      class="status-item"
      [class.connected]="aghuConnected"
      [class.disconnected]="!aghuConnected"
      title="Integração AGHU"
    >
      <ion-icon name="cloud-outline"></ion-icon>
      <span>AGHU</span>
    </div>
  </div>
</div>
