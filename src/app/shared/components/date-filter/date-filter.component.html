<!-- date-filter.component.html -->
<div class="date-filter-container">
  <div class="date-filter" (click)="openPicker(dateInput)">
    <ion-icon name="calendar-outline" class="calendar-icon"></ion-icon>
    <label>
      <span class="label-text">{{ 'sharedComponents.dateFilter.dateLabel' | translate }}</span>
      <strong class="date-text">{{ formattedDate || ('sharedComponents.dateFilter.allLabel' | translate) }}</strong>
    </label>
    <ion-icon name="chevron-down-outline" class="chevron-icon"></ion-icon>
    <input 
      #dateInput 
      id="date-input" 
      type="date" 
      (change)="onChange($event)" 
      [value]="date"
    >
  </div>
  
  <div class="filter-actions">
    <button
      *ngIf="date"
      class="clear-btn"
      (click)="clearFilter(); $event.stopPropagation()"
      [title]="'sharedComponents.dateFilter.clearFilterTitle' | translate"
    >
      <ion-icon name="close-circle"></ion-icon>
    </button>
    <button
      class="today-btn"
      (click)="setToday(); $event.stopPropagation()"
      [title]="'sharedComponents.dateFilter.today' | translate"
    >
      {{ 'sharedComponents.dateFilter.today' | translate }}
    </button>
  </div>
</div>
