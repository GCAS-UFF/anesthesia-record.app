<header class="hospital-header">
  <div class="header-left">
    <button class="menu-btn" (click)="openMenu()" aria-label="Abrir menu">
      <ion-icon name="menu-outline"></ion-icon>
    </button>
  </div>

  <div class="header-right">
    <div class="status-group">
      <div
        class="status-item"
        [class.connected]="serverConnected"
        [class.disconnected]="!serverConnected"
        title="Conexão com a rede"
      >
        <ion-icon name="wifi-outline"></ion-icon>
        <span>Rede</span>
      </div>

      <div
        class="status-item"
        [class.connected]="aghuConnected"
        [class.disconnected]="!aghuConnected"
        title="Integração AGHU"
      >
        <ion-icon name="cloud-outline"></ion-icon>
        <span>AGHU</span>
      </div>

      <div class="doctor-chip-wrapper">
        <div
          class="doctor-chip"
          (click)="toggleUserMenu()"
          [class.menu-open]="userMenuOpen"
        >
          <div class="avatar">{{ doctorInitials }}</div>
          <div class="doctor-info">
            <span class="doctor-name">{{ doctorName }}</span>
            <span class="doctor-role">{{ doctorRole }}</span>
          </div>
          <ion-icon name="chevron-down-outline" class="chevron"></ion-icon>
        </div>

        <div
          class="user-menu"
          *ngIf="userMenuOpen"
          (click)="closeUserMenu($event)"
        >
          <button class="user-menu-item" (click)="goToSettings()">
            <ion-icon name="settings-outline"></ion-icon>
            <span>Configurações</span>
          </button>
          <button class="user-menu-item logout" (click)="handleLogout()">
            <ion-icon name="log-out-outline"></ion-icon>
            <span>Sair</span>
          </button>
        </div>
      </div>
    </div>
  </div>
</header>

<div class="user-menu" *ngIf="userMenuOpen" (click)="closeUserMenu($event)">
  <button class="user-menu-item" (click)="goToSettings()">
    <ion-icon name="settings-outline"></ion-icon>
    <span>Configurações</span>
  </button>
  <button class="user-menu-item logout" (click)="handleLogout()">
    <ion-icon name="log-out-outline"></ion-icon>
    <span>Sair</span>
  </button>
</div>

<div
  class="drawer-backdrop"
  [class.open]="menuOpen"
  (click)="closeMenu()"
></div>
<aside
  class="drawer"
  [class.open]="menuOpen"
  role="dialog"
  aria-label="Menu principal"
>
  <div class="drawer-header">
    <div class="drawer-logos">
      <img src="assets/Logo.png" alt="UFF" class="logo uff" />
      <span class="drawer-title">HUAP · UFF</span>
    </div>
    <button class="close-btn" (click)="closeMenu()" aria-label="Fechar menu">
      <ion-icon name="close-outline"></ion-icon>
    </button>
  </div>

  <nav class="drawer-nav">
    <button
      *ngFor="let item of navItems"
      class="nav-item"
      [class.active]="item.active"
      (click)="navigate(item)"
    >
      <ion-icon [name]="item.icon"></ion-icon>
      <span>{{ item.label }}</span>
    </button>
  </nav>
</aside>
