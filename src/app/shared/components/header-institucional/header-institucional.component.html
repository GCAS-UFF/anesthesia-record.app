<header class="hospital-header">
  <div class="header-left">
    <button class="menu-btn" (click)="openMenu()" aria-label="Abrir menu">
      <ion-icon name="menu-outline"></ion-icon>
    </button>

    <button
      type="button"
      class="header-back-btn"
      [class.is-hidden]="menuOpen"
      *ngIf="showBackButton"
      (click)="voltar()"
      aria-label="Voltar"
    >
      <ion-icon name="arrow-back-outline"></ion-icon>
    </button>

  </div>

  <div class="header-right">
    <button
      type="button"
      class="header-icon-btn"
      [class.is-hidden]="menuOpen"
      *ngIf="showPreAnestesicaButton"
      (click)="openPreAnestesica.emit()"
      [attr.aria-label]="preAnestesicaButtonLabel"
      [title]="preAnestesicaButtonLabel"
    >
      <span class="header-icon-btn-icon header-icon-btn-icon--pre">
        <ion-icon name="document-text-outline"></ion-icon>
      </span>
      <span class="header-icon-btn-label" *ngIf="preAnestesicaButtonLabel">{{
        preAnestesicaButtonLabel
      }}</span>
    </button>

    <button
      type="button"
      class="header-icon-btn"
      [class.is-hidden]="menuOpen"
      *ngIf="showAnestesicaButton"
      (click)="openAnestesica.emit()"
      [attr.aria-label]="anestesicaButtonLabel"
      [title]="anestesicaButtonLabel"
    >
      <span class="header-icon-btn-icon header-icon-btn-icon--anes">
        <ion-icon name="document-text-outline"></ion-icon>
      </span>
      <span class="header-icon-btn-label" *ngIf="anestesicaButtonLabel">{{
        anestesicaButtonLabel
      }}</span>
    </button>

    <button
      type="button"
      *ngFor="let btn of actionButtons; trackBy: trackActionButton"
      class="header-icon-btn"
      [class.is-hidden]="menuOpen"
      [disabled]="btn.disabled"
      [attr.aria-label]="btn.ariaLabel"
      [title]="btn.ariaLabel"
      (click)="onActionButtonClick(btn)"
    >
      <span
        class="header-icon-btn-icon"
        [ngClass]="'header-icon-btn-icon--' + (btn.color || 'primary')"
      >
        <ion-icon [name]="btn.icon"></ion-icon>
      </span>
      <span class="header-icon-btn-label" *ngIf="btn.label">{{ btn.label }}</span>
    </button>

    <div class="doctor-chip-wrapper">
      <div
        class="doctor-chip"
        (click)="toggleUserMenu()"
        [class.menu-open]="userMenuOpen"
      >
        <div class="avatar">{{ doctorInitials }}</div>
        <div class="doctor-info">
          <span class="doctor-name">{{ doctorName }}</span>
          <span class="doctor-role">{{ doctorRole }}</span>
        </div>
        <ion-icon name="chevron-down-outline" class="chevron"></ion-icon>
      </div>

      <div
        class="user-menu"
        *ngIf="userMenuOpen"
        (click)="closeUserMenu($event)"
      >
        <button class="user-menu-item" (click)="goToSettings()">
          <ion-icon name="settings-outline"></ion-icon>
          <span>Configurações</span>
        </button>
        <button class="user-menu-item logout" (click)="handleLogout()">
          <ion-icon name="log-out-outline"></ion-icon>
          <span>Sair</span>
        </button>
      </div>
    </div>
  </div>
</header>

<div
  class="drawer-backdrop"
  [class.open]="menuOpen"
  (click)="closeMenu()"
></div>
<aside
  class="drawer"
  [class.open]="menuOpen"
  role="dialog"
  aria-label="Menu principal"
>
  <div class="drawer-header">
    <button class="close-btn" (click)="closeMenu()" aria-label="Fechar menu">
      <ion-icon name="close-outline"></ion-icon>
    </button>
    <div class="drawer-logos">
      <img src="assets/Logo.png" alt="Logo" class="logo uff" />
      <span class="drawer-title">{{ hospitalName }}</span>
    </div>
  </div>

  <nav class="drawer-nav">
    <button
      *ngFor="let item of visibleNavItems"
      class="nav-item"
      [class.active]="item.active"
      (click)="navigate(item)"
    >
      <ion-icon [name]="item.icon"></ion-icon>
      <span>{{ item.label }}</span>
    </button>
  </nav>
</aside>
