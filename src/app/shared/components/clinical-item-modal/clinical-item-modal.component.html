<ion-header class="ion-no-border custom-header">
  <ion-toolbar>
    <ion-title>
      <ng-container [ngSwitch]="type">
        <span *ngSwitchCase="'agent'">Adicionar Agente</span>
        <span *ngSwitchCase="'event'">Adicionar Evento</span>
        <span *ngSwitchCase="'balance'">Adicionar Balanço</span>
      </ng-container>
    </ion-title>
    <ion-buttons slot="end">
      <ion-button (click)="cancel()">
        <ion-icon name="close-outline" slot="icon-only"></ion-icon>
      </ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  <div class="modal-shell">
    
    <ng-container *ngIf="type === 'agent'">

      <!-- Busca de medicação por nome -->
      <div class="field">
        <label class="field-label">Medicação *</label>
        <div class="custom-search" [class.open]="medDropdownOpen">
          <div class="custom-input-wrap">
            <ion-icon name="search-outline" class="custom-icon"></ion-icon>
            <input
              type="text"
              class="custom-input"
              placeholder="Digite o nome da medicação..."
              [value]="medSearchTerm"
              (input)="onMedSearchInput($any($event.target).value)"
              (focus)="onMedFocus()"
              (blur)="onMedBlur()"
              (keydown)="onMedKeydown($event)"
              autocomplete="off" />
            <button
              *ngIf="medSearchTerm"
              type="button"
              class="custom-clear"
              (mousedown)="$event.preventDefault()"
              (click)="clearMedication()">
              <ion-icon name="close-circle"></ion-icon>
            </button>
          </div>

          <div class="custom-dropdown" *ngIf="medDropdownOpen && medSuggestions.length">
            <button
              *ngFor="let m of medSuggestions; let i = index"
              type="button"
              class="custom-option"
              [class.active]="i === medHighlightIndex"
              (mousedown)="$event.preventDefault()"
              (click)="selectMedication(m)">
              <span class="custom-name">{{ m.description }}</span>
              <ion-icon
                *ngIf="agent.medicationId === m.id"
                name="checkmark-outline"
                class="custom-check"></ion-icon>
            </button>
          </div>

          <div class="custom-empty"
               *ngIf="medDropdownOpen && !medSuggestions.length && medSearchTerm">
            Nenhuma medicação encontrada.
          </div>
        </div>
        <ion-note *ngIf="!medications.length" color="warning" class="ion-margin-top">
          Nenhuma medicação carregada no storage.
        </ion-note>
      </div>

      <div class="field dose-row">
        <div class="dose-value">
          <label class="field-label">Dose *</label>
          <div class="custom-input-wrap">
            <input class="custom-input" type="number" inputmode="decimal" min="0" step="any" [(ngModel)]="agent.doseValue" placeholder="ex: 100" />
          </div>
        </div>
        <div class="dose-unit">
          <label class="field-label">Unidade *</label>
          <div class="custom-input-wrap select-wrap">
            <select class="custom-input" [(ngModel)]="agent.doseUnit">
              <option *ngFor="let u of unitOptions" [ngValue]="u.id">{{ u.label }}</option>
            </select>
            <ion-icon name="chevron-down-outline" class="select-icon"></ion-icon>
          </div>
        </div>
      </div>

      <div class="field">
        <label class="field-label">Via *</label>
        <div class="custom-input-wrap select-wrap">
          <select class="custom-input" [(ngModel)]="agent.routeId">
            <option [ngValue]="null" disabled selected hidden>Selecione</option>
            <option *ngFor="let r of routeOptions" [ngValue]="r.id">{{ r.label }}</option>
          </select>
          <ion-icon name="chevron-down-outline" class="select-icon"></ion-icon>
        </div>
      </div>
    </ng-container>
    
    <ng-container *ngIf="type === 'event'">
      <div class="field">
        <label class="field-label">Evento *</label>

        <div class="custom-input-wrap event-search-wrap" *ngIf="eventTypes.length > 6">
          <ion-icon name="search-outline" class="custom-icon"></ion-icon>
          <input
            type="text"
            class="custom-input"
            placeholder="Buscar evento..."
            [value]="eventSearchTerm"
            (input)="onEventSearchInput($any($event.target).value)"
            autocomplete="off" />
        </div>

        <div class="event-grid" *ngIf="filteredEventTypes.length; else noEvents">
          <button
            *ngFor="let e of filteredEventTypes"
            type="button"
            class="event-card"
            [class.active]="event.eventTypeId === e.id"
            (click)="selectEventType(e)">
            <span class="event-card-name">{{ e.name }}</span>
            <ion-icon *ngIf="event.eventTypeId === e.id" name="checkmark-outline" class="event-card-check"></ion-icon>
          </button>
        </div>

        <ng-template #noEvents>
          <ion-note color="warning" class="ion-margin-top">
            Nenhum evento cadastrado. Peça ao administrador para cadastrar eventos em "Manutenção de Itens".
          </ion-note>
        </ng-template>
      </div>

      <div class="field">
        <label class="field-label">Descrição *</label>
        <textarea
          class="custom-input custom-textarea"
          rows="4"
          [(ngModel)]="event.description"
          placeholder="Descreva o evento..."></textarea>
      </div>
    </ng-container>
    
    <ng-container *ngIf="type === 'balance'">
      <div class="field">
        <label class="field-label">Tipo *</label>
        <div class="seg-row">
          <ion-button
            [fill]="balance.type === 'gain' ? 'solid' : 'outline'"
            color="success"
            (click)="onBalanceTypeChange('gain')">Ganho</ion-button>
          <ion-button
            [fill]="balance.type === 'loss' ? 'solid' : 'outline'"
            color="danger"
            (click)="onBalanceTypeChange('loss')">Perda</ion-button>
        </div>
      </div>

      <div class="field">
        <label class="field-label">Item *</label>
        <div class="custom-input-wrap select-wrap">
          <select class="custom-input" [ngModel]="balance.itemId" (ngModelChange)="onBalanceItemChange($event)">
            <option value="" disabled selected hidden>Selecione</option>
            <option *ngFor="let i of balanceItems" [value]="i.id">{{ i.label }}</option>
          </select>
          <ion-icon name="chevron-down-outline" class="select-icon"></ion-icon>
        </div>
      </div>

      <div class="field" *ngIf="needsDetail">
        <label class="field-label">Detalhar "Outro" *</label>
        <div class="custom-input-wrap">
          <input class="custom-input" type="text" [(ngModel)]="balance.detail" placeholder="Especifique..." />
        </div>
      </div>

      <div class="field">
        <label class="field-label">Volume (ml) *</label>
        <div class="custom-input-wrap">
          <input class="custom-input" type="number" inputmode="numeric" [(ngModel)]="balance.volumeMl" placeholder="0" />
        </div>
      </div>
    </ng-container>

  </div>
</ion-content>

<ion-footer class="ion-no-border">
  <div class="modal-footer">
    <button type="button" class="btn-cancel" (click)="cancel()">Cancelar</button>
    <button type="button" class="btn-save" [disabled]="!canSave" (click)="save()">
      <ion-icon name="checkmark-outline"></ion-icon> Salvar
    </button>
  </div>
</ion-footer>
