<ion-header>
  <ion-toolbar>
    <ion-title>
      <ng-container [ngSwitch]="type">
        <span *ngSwitchCase="'agent'">Adicionar Agente</span>
        <span *ngSwitchCase="'event'">Adicionar Evento</span>
        <span *ngSwitchCase="'balance'">Adicionar Balanço</span>
      </ng-container>
    </ion-title>
    <ion-buttons slot="end">
      <ion-button (click)="cancel()">
        <ion-icon name="close-outline" slot="icon-only"></ion-icon>
      </ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">

  <!-- ═══════════════════ AGENTES ═══════════════════ -->
  <ng-container *ngIf="type === 'agent'">

    <!-- Busca de medicação por nome -->
    <div class="field">
      <label class="field-label">Medicação *</label>
      <div class="med-search" [class.open]="medDropdownOpen">
        <div class="med-input-wrap">
          <ion-icon name="search-outline" class="med-icon"></ion-icon>
          <input
            type="text"
            class="med-input"
            placeholder="Digite o nome da medicação..."
            [value]="medSearchTerm"
            (input)="onMedSearchInput($any($event.target).value)"
            (focus)="onMedFocus()"
            (blur)="onMedBlur()"
            (keydown)="onMedKeydown($event)"
            autocomplete="off" />
          <button
            *ngIf="medSearchTerm"
            type="button"
            class="med-clear"
            (mousedown)="$event.preventDefault()"
            (click)="clearMedication()">
            <ion-icon name="close-circle"></ion-icon>
          </button>
        </div>

        <div class="med-dropdown" *ngIf="medDropdownOpen && medSuggestions.length">
          <button
            *ngFor="let m of medSuggestions; let i = index"
            type="button"
            class="med-option"
            [class.active]="i === medHighlightIndex"
            (mousedown)="$event.preventDefault()"
            (click)="selectMedication(m)">
            <span class="med-name">{{ m.description }}</span>
            <ion-icon
              *ngIf="agent.medicationId === m.id"
              name="checkmark-outline"
              class="med-check"></ion-icon>
          </button>
        </div>

        <div class="med-empty"
             *ngIf="medDropdownOpen && !medSuggestions.length && medSearchTerm">
          Nenhuma medicação encontrada.
        </div>
      </div>
      <ion-note *ngIf="!medications.length" color="warning">
        Nenhuma medicação carregada no storage.
      </ion-note>
    </div>

    <ion-item lines="full">
      <ion-label position="stacked">Dose *</ion-label>
      <ion-input [(ngModel)]="agent.dose" placeholder="ex: 100mg, 2mL, 5UI"></ion-input>
    </ion-item>

    <ion-item lines="full">
      <ion-label position="stacked">Via</ion-label>
      <ion-select interface="popover" [(ngModel)]="agent.route" placeholder="Selecione">
        <ion-select-option *ngFor="let r of routeOptions" [value]="r">{{ r }}</ion-select-option>
      </ion-select>
    </ion-item>
  </ng-container>

  <!-- ═══════════════════ EVENTOS ═══════════════════ -->
  <ng-container *ngIf="type === 'event'">
    <ion-item lines="full">
      <ion-label position="stacked">Categoria *</ion-label>
      <ion-select
        interface="popover"
        placeholder="Selecione a categoria"
        [ngModel]="event.categoryId"
        (ngModelChange)="onEventCategoryChange($event)">
        <ion-select-option *ngFor="let c of eventCategories" [value]="c.id">
          {{ c.emoji }} &nbsp; {{ c.label }}
        </ion-select-option>
      </ion-select>
    </ion-item>

    <ion-item lines="full">
      <ion-label position="stacked">Descrição *</ion-label>
      <ion-input [(ngModel)]="event.description" placeholder="Descreva o evento..."></ion-input>
    </ion-item>
  </ng-container>

  <!-- ═══════════════════ BALANÇO ═══════════════════ -->
  <ng-container *ngIf="type === 'balance'">
    <ion-item lines="full">
      <ion-label position="stacked">Tipo *</ion-label>
      <div class="seg-row">
        <ion-button
          [fill]="balance.type === 'gain' ? 'solid' : 'outline'"
          color="success"
          (click)="onBalanceTypeChange('gain')">Ganho</ion-button>
        <ion-button
          [fill]="balance.type === 'loss' ? 'solid' : 'outline'"
          color="danger"
          (click)="onBalanceTypeChange('loss')">Perda</ion-button>
      </div>
    </ion-item>

    <ion-item lines="full">
      <ion-label position="stacked">Item *</ion-label>
      <ion-select
        interface="popover"
        placeholder="Selecione"
        [ngModel]="balance.itemId"
        (ngModelChange)="onBalanceItemChange($event)">
        <ion-select-option *ngFor="let i of balanceItems" [value]="i.id">
          {{ i.label }}
        </ion-select-option>
      </ion-select>
    </ion-item>

    <ion-item *ngIf="needsDetail" lines="full">
      <ion-label position="stacked">Detalhar "Outro" *</ion-label>
      <ion-input [(ngModel)]="balance.detail" placeholder="Especifique..."></ion-input>
    </ion-item>

    <ion-item lines="full">
      <ion-label position="stacked">Volume (ml) *</ion-label>
      <ion-input type="number" inputmode="numeric" [(ngModel)]="balance.volumeMl" placeholder="0"></ion-input>
    </ion-item>
  </ng-container>

</ion-content>

<ion-footer>
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-button (click)="cancel()">Cancelar</ion-button>
    </ion-buttons>
    <ion-buttons slot="end">
      <ion-button fill="solid" color="primary" [disabled]="!canSave" (click)="save()">
        <ion-icon name="checkmark-outline" slot="start"></ion-icon>
        Salvar
      </ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-footer>
