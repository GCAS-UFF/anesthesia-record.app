<ion-header class="vital-modal-header">
  <ion-toolbar>
    <ion-title>
      <span class="title-wrap">
        <ion-icon name="pulse-outline"></ion-icon>
        {{ isAuto ? 'Registro automático' : 'Lançar sinais vitais' }}
      </span>
    </ion-title>
    <ion-buttons slot="end">
      <ion-button fill="clear" (click)="cancel()" aria-label="Fechar">
        <ion-icon name="close-outline" slot="icon-only"></ion-icon>
      </ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content class="vital-modal-content">
  <div class="modal-shell">
    <section class="time-banner">
      <ion-icon name="time-outline"></ion-icon>
      <div>
        <strong>{{ isAuto ? 'Coleta automática' : 'Registro manual' }}</strong>
        <span>Preencha os sinais disponíveis neste momento.</span>
      </div>
    </section>

    <section class="vital-group" *ngFor="let group of vitalGroups">
      <header>{{ group.title }}</header>

      <div class="vital-grid">
        <label class="vital-field" *ngFor="let field of group.fields">
          <span class="field-label">
            {{ field.label }}
            <small class="unit-chip" *ngIf="field.unit">{{ field.unit }}</small>
          </span>
          <ion-input
            type="number"
            inputmode="decimal"
            [min]="field.min"
            [max]="field.max"
            [step]="field.step || '1'"
            [value]="form[field.key]"
            (ionInput)="setValue(field.key, $event.detail.value)"
            placeholder="--">
          </ion-input>
        </label>
      </div>
    </section>

    <section class="vital-group" *ngIf="customFields?.length">
      <header>Campos personalizados</header>

      <div class="vital-grid">
        <label class="vital-field" *ngFor="let field of customFields">
          <span class="field-label">
            {{ field.label }}
            <small class="unit-chip" *ngIf="field.unit">{{ field.unit }}</small>
          </span>
          <ion-input
            type="number"
            inputmode="decimal"
            [value]="form.custom?.[field.key]"
            (ionInput)="setCustomValue(field.key, $event.detail.value)"
            placeholder="--">
          </ion-input>
        </label>
      </div>
    </section>

    <p class="validation-message" *ngIf="touched && !hasAnyRequiredSignal()">
      Informe pelo menos um sinal vital para salvar o registro.
    </p>
  </div>
</ion-content>

<ion-footer>
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-button fill="clear" color="medium" (click)="cancel()">Cancelar</ion-button>
    </ion-buttons>
    <ion-buttons slot="end">
      <ion-button fill="solid" color="primary" [disabled]="!hasAnyRequiredSignal()" (click)="save()">
        <ion-icon name="save-outline" slot="start"></ion-icon>
        Salvar registro
      </ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-footer>
