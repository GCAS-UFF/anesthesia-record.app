<ion-header class="ion-no-border">
  <div class="modal-header">
    <h2 class="modal-title">{{ (isAuto ? 'sharedComponents.quickVitalInput.autoTitle' : 'sharedComponents.quickVitalInput.manualTitle') | translate }}</h2>
    <button type="button" class="btn-close" (click)="cancel()" [attr.aria-label]="'common.close' | translate" [title]="'common.close' | translate">
      <ion-icon name="close-outline"></ion-icon>
    </button>
  </div>
</ion-header>

<ion-content>
  <div class="modal-body">

    <label class="field">
      <span class="field-label">{{ 'sharedComponents.quickVitalInput.timeOfRecordLabel' | translate }}</span>
      <span class="field-input">
        <input
          type="time"
          [value]="form.time"
          (input)="setTime($any($event.target).value)">
      </span>
      <span class="field-hint" *ngIf="!isEdit">{{ 'sharedComponents.quickVitalInput.fillAvailableSignals' | translate }}</span>
    </label>

    <div class="fields-grid">
      <label class="field" *ngFor="let field of vitalFields">
        <span class="field-label">{{ field.label | translate }}<ng-container *ngIf="field.unit"> ({{ field.unit }})</ng-container></span>
        <span class="field-input">
          <input
            type="number"
            inputmode="decimal"
            [min]="field.min"
            [max]="field.max"
            [step]="field.step || '1'"
            [value]="form[field.key]"
            (input)="setValue(field.key, $any($event.target).value)">
        </span>
      </label>

      <label class="field" *ngFor="let field of customFields">
        <span class="field-label">{{ field.label }}<ng-container *ngIf="field.unit"> ({{ field.unit }})</ng-container></span>
        <span class="field-input">
          <input
            type="number"
            inputmode="decimal"
            [value]="form.custom?.[field.key]"
            (input)="setCustomValue(field.key, $any($event.target).value)">
        </span>
      </label>
    </div>

    <p class="validation-message" *ngIf="touched && !hasAnyRequiredSignal()">
      {{ 'sharedComponents.quickVitalInput.validationMessage' | translate }}
    </p>
  </div>
</ion-content>

<ion-footer class="ion-no-border">
  <div class="modal-footer">
    <button type="button" class="btn-save" [disabled]="!hasAnyRequiredSignal()" (click)="save()">
      {{ 'sharedComponents.quickVitalInput.saveRecord' | translate }}
    </button>
  </div>
</ion-footer>
